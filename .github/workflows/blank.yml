name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. ALWAYS checkout the repository FIRST
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Java and caching AFTER checkout
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Grant execution permissions
    - name: Make gradlew executable
      run: chmod +x gradlew

    # 4. Run the Gradle build
    - name: Build with Gradle
      run: ./gradlew assembleDebug
      
